name: Build Samposhi Farm Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Assemble Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Image Tools
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pillow

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Synchronize Web Assets and Generate Icons
        run: |
          python3 MobileApp_v2/build_deployable.py --esp32
          python3 MobileApp_v2/android/sync_assets.py

      - name: Ensure Gradle Wrapper is Ready
        working-directory: MobileApp_v2/android
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradle/wrapper/gradle-wrapper.jar || \
            curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://repo.maven.apache.org/maven2/org/gradle/gradle-wrapper/8.4/gradle-wrapper-8.4.jar
          fi
          chmod +x gradlew

      - name: Build Android APK with Gradle
        working-directory: MobileApp_v2/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Organize Built APK
        run: |
          mkdir -p dist-apk
          cp MobileApp_v2/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/SamposhiFarm-v2.2.apk
          ls -la dist-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SamposhiFarm-Android-APK
          path: dist-apk/SamposhiFarm-v2.2.apk
          retention-days: 30
